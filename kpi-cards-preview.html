<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KPI Cards – Preview</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#0b1220;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .kpi-page{max-width:1480px;margin:0 auto;padding:32px 20px}
  .kpi-grid{display:grid;gap:12px;grid-template-columns:repeat(1,minmax(0,1fr))}
  @media (min-width:520px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:900px){.kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:1280px){.kpi-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}

  .kpi-card{position:relative;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,#101a2e 0%,#0d1527 100%);
    border:1px solid rgba(148,163,184,.14);border-radius:12px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.6);
    transition:border-color .15s,transform .15s;padding:0}
  .kpi-card:hover{border-color:rgba(148,163,184,.28)}
  .kpi-accent{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
    box-shadow:0 0 10px 1px var(--accent),0 0 22px 2px color-mix(in srgb,var(--accent) 45%,transparent)}
  .kpi-body{flex:1;padding:14px 14px 12px 24px}
  .kpi-head{display:flex;align-items:center;gap:8px}
  .kpi-ibox{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;
    color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
  .kpi-label{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:#fff;line-height:1.25}
  .kpi-value{margin-top:12px;font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;white-space:nowrap;color:#fff}
  @media (min-width:1280px) and (max-width:1535px){.kpi-value{font-size:21px}}
  .kpi-sub{margin-top:4px;font-size:13px;font-weight:500;color:#94a3b8;font-variant-numeric:tabular-nums}
  .kpi-trend{margin-top:8px;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .kpi-trend.pos{color:#34d399}
  .kpi-trend.neg{color:#f87171}
  .kpi-cmp{margin-top:2px;font-size:11px;line-height:1.35;color:#8190a6}
  .kpi-foot{display:flex;width:100%;align-items:center;justify-content:space-between;
    padding:10px 14px 10px 24px;background:rgba(2,6,16,.55);border:0;border-top:1px solid rgba(148,163,184,.1);
    color:#cbd5e1;font:inherit;font-size:12px;font-weight:500;text-align:left;cursor:pointer;
    transition:background .15s,color .15s}
  .kpi-foot:hover{background:rgba(255,255,255,.05);color:#fff}
  .kpi-foot:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .kpi-foot svg{color:#64748b;transition:transform .15s,color .15s}
  .kpi-foot:hover svg{color:#fff;transform:translateX(2px)}
  svg.kpi-ic{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="kpi-page"><div class="kpi-grid" id="kpi-grid"></div></div>

<script>
const svg=(p,s=16,sw=2)=>`<svg class="kpi-ic" xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" style="stroke-width:${sw}" aria-hidden="true">${p}</svg>`;
const I={
 Users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 UserPlus:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
 CircleDollarSign:'<circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/>',
 AlertTriangle:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
 CalendarClock:'<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/>',
 CalendarRange:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M17 14h-6"/><path d="M13 18H7"/><path d="M7 14h.01"/><path d="M17 18h.01"/>',
 ChevronRight:'<path d="m9 18 6-6-6-6"/>',
 ArrowUp:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
 ArrowDown:'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>'
};
const BLUE='#3b82f6';
const cards=[
 {label:'Clientes ativos',icon:'Users',accent:BLUE,value:'32',trend:{dir:'up',tone:'pos',text:'+3 (10,3%)'},cmp:'vs. 29 no mês anterior',foot:'Ver clientes (32)'},
 {label:'Clientes novos',icon:'UserPlus',accent:'#22c55e',value:'5',trend:{dir:'up',tone:'pos',text:'+3 (150%)'},cmp:'vs. 2 no mês anterior',foot:'Ver clientes (5)'},
 {label:'Receita do período',icon:'CircleDollarSign',accent:'#14b8a6',value:'R$ 14.980,00',trend:{dir:'up',tone:'pos',text:'+28%'},cmp:'vs. R$ 11.680,00 no período anterior',foot:'Ver clientes (32)'},
 {label:'Clientes em atraso',icon:'AlertTriangle',accent:'#ef4444',value:'4',trend:{dir:'up',tone:'neg',text:'+1 (33%)'},cmp:'vs. 3 no mês anterior',foot:'Ver clientes (4)'},
 {label:'Vencem esta semana',icon:'CalendarClock',accent:BLUE,value:'6',sub:'R$ 4.320,00',foot:'Ver clientes (6)'},
 {label:'Vencem próxima semana',icon:'CalendarRange',accent:BLUE,value:'8',sub:'R$ 6.480,00',foot:'Ver clientes (8)'}
];
document.getElementById('kpi-grid').innerHTML=cards.map(c=>`
<article class="kpi-card" style="--accent:${c.accent}">
  <span class="kpi-accent" aria-hidden="true"></span>
  <div class="kpi-body">
    <div class="kpi-head">
      <span class="kpi-ibox">${svg(I[c.icon],16)}</span>
      <span class="kpi-label" title="${c.label}">${c.label}</span>
    </div>
    <div class="kpi-value">${c.value}</div>
    ${c.sub?`<div class="kpi-sub">${c.sub}</div>`:''}
    ${c.trend?`<div class="kpi-trend ${c.trend.tone}">${svg(c.trend.dir==='up'?I.ArrowUp:I.ArrowDown,13,2.5)}<span>${c.trend.text}</span></div><div class="kpi-cmp">${c.cmp}</div>`:''}
  </div>
  <button class="kpi-foot" type="button"><span>${c.foot}</span>${svg(I.ChevronRight,15)}</button>
</article>`).join('');
</script>
</body>
</html>
