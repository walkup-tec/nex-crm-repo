<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – Bloco Geográfico (preview)</title>
<style>
  :root{
    --page:#0b1220; --card:#101a2e; --border:rgba(148,163,184,.14);
    --text:#e2e8f0; --muted:#94a3b8; --faint:#64748b;
    --sudeste:#8b5cf6; --sul:#6366f1; --nordeste:#38bdf8; --co:#22d3ee; --norte:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:32px}
  .geo-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto}
  @media (max-width:1000px){.geo-grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -18px rgba(0,0,0,.6)}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
  .card h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
  .card p.sub{margin:4px 0 0;font-size:13px;color:var(--muted)}

  /* select */
  .select{position:relative}
  .select select{appearance:none;-webkit-appearance:none;background:#0b1424;color:var(--text);
    border:1px solid var(--border);border-radius:10px;padding:8px 34px 8px 12px;font:inherit;font-size:13px;cursor:pointer;
    transition:border-color .15s, box-shadow .15s}
  .select select:hover{border-color:rgba(148,163,184,.3)}
  .select select:focus{outline:none;border-color:var(--sudeste);box-shadow:0 0 0 3px rgba(139,92,246,.22)}
  .select svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}

  /* left card body */
  .region-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:center}
  @media (max-width:760px){.region-body{grid-template-columns:1fr}}
  .map-wrap svg{width:100%;height:auto;display:block;overflow:visible}
  .region{stroke:#101a2e;stroke-width:2;stroke-linejoin:round;transition:filter .2s, opacity .2s}
  .region:hover{filter:brightness(1.12)}
  .region.active{filter:drop-shadow(0 0 10px rgba(139,92,246,.55))}
  .callout rect{fill:#0d1628;stroke:rgba(148,163,184,.22);stroke-width:1}
  .callout.active rect{fill:rgba(139,92,246,.14);stroke:#8b5cf6;stroke-width:1.5}
  .callout .nm{fill:#94a3b8;font-size:11px}
  .callout .val{fill:#f1f5f9;font-size:13px;font-weight:600}
  .callout.active .nm{fill:#c4b5fd}
  .leader{fill:none;stroke:rgba(148,163,184,.5);stroke-width:1}
  .leader.active{stroke:#8b5cf6;stroke-width:1.4}
  .anchor{stroke:#101a2e;stroke-width:1.5}

  /* table */
  .tbl{width:100%}
  .tbl-head,.tbl-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 72px;gap:10px;align-items:center}
  .tbl-head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
    padding:0 0 10px;border-bottom:1px solid var(--border)}
  .tbl-head span:nth-child(n+2),.tbl-row .n{text-align:right}
  .tbl-row{padding:13px 0;border-bottom:1px solid rgba(148,163,184,.08)}
  .tbl-row:last-child{border-bottom:0}
  .tbl-row.active{background:linear-gradient(90deg,rgba(139,92,246,.10),transparent);
    margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:8px;border-bottom-color:transparent}
  .name{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent);background:var(--c)}
  .bar{grid-column:1 / 2;height:4px;border-radius:99px;background:rgba(148,163,184,.12);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
  .tbl-row .cell-name{min-width:0}
  .tbl-row .n{font-size:14px;font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
  .tbl-row .p{font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}

  /* right card */
  .chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
  .grid-line{stroke:rgba(148,163,184,.12);stroke-width:1;stroke-dasharray:3 4}
  .axis-line{stroke:rgba(148,163,184,.25);stroke-width:1}
  .tick{fill:#64748b;font-size:11px}
  .uf{fill:#94a3b8;font-size:12px;font-weight:500}
  .vl{fill:#e2e8f0;font-size:12px;font-weight:600;text-anchor:middle}
  .bars path{transition:filter .15s}
  .bars path:hover{filter:brightness(1.18)}
</style>
</head>
